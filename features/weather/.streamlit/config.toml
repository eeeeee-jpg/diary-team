# MOIPJI 단독 실행용 테마 (features/weather 폴더에서 streamlit run 할 때 적용)
# 배경 그라데이션·유리 효과·도트 글꼴은 weather.py의 PAGE_CSS가 날씨 상태에 맞춰 입힌다.
# 여기 값은 드롭다운 목록처럼 페이지 밖에 뜨는 요소의 기본색이다.
[theme]
base = "light"
primaryColor = "#FF9A4D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4F6"
textColor = "#1A1A1A"
borderColor = "#D9DDE3"
baseRadius = "0px"
font = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
