# 밥때 손님 설정. 확률·단골 레벨·품종 목록은 이 파일에서만 바꾼다.

# 희귀도별 출현 가중치 (D-1). 희귀도를 먼저 뽑고, 그 희귀도의 품종 중에서 균등하게 뽑는다.
[rarity_weights]
common = 70
rare = 25
legendary = 5

[rarity_labels]
common = "일반"
rare = "희귀"
legendary = "전설"

# 단골 레벨 (D-4). 만난 횟수가 min_count 이상이면 그 레벨.
[[loyalty_levels]]
level = 1
min_count = 1
title = "첫 만남"

[[loyalty_levels]]
level = 2
min_count = 3
title = "아는 사이"

[[loyalty_levels]]
level = 3
min_count = 7
title = "단골"

[[loyalty_levels]]
level = 4
min_count = 15
title = "찐단골"

# 품종 마스터 데이터 (MVP 20종: 개 10 + 고양이 10). PRD 13장 확률표가 확정되면 갱신한다.
# photo: 강아지는 Dog CEO 품종 경로, 고양이는 TheCatAPI 사진 id (둘 다 키 없이 호출).
# fur·accent·ear는 사진을 못 불러올 때와 못 만난 품종 실루엣에 쓰는 SVG 그림 색과 귀 모양이다.

